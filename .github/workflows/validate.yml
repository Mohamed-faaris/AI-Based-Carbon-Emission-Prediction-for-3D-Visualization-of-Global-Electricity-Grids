name: Validate platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate carbon data contracts
        run: python -m unittest discover -s tests -v
      - name: Check Carbon Intelligence JavaScript syntax
        run: node --check web/carbon/carbon.js
